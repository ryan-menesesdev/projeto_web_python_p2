<!DOCTYPE html>
<html>
<head>
    <title>Pagamento</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        h2 {
            color: #27ae60;
            margin-bottom: 30px;
            background: #e8f8f5;
            padding: 10px 20px;
            border-radius: 20px;
        }
        form {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            margin-top: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        button {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #27ae60;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Pagamento Simulador</h1>
    <h2>Total a Pagar: R$ {{ "%.2f"|format(total) }}</h2>
    <form action="{{ url_for('checkout') }}" method="POST">
        <label>Nome no Cartao:</label>
        <input type="text" name="card_name" required>
        <br>
        <label>Numero do Cartao:</label>
        <input type="text" name="card_number" maxlength="16" required>
        <br>
        <label>Validade (MM/AA):</label>
        <input type="text" name="expiry" maxlength="5" required>
        <br>
        <label>CVV:</label>
        <input type="text" name="cvv" maxlength="3" required>
        <br>
        <button type="submit">Finalizar Compra</button>
    </form>
    <a href="{{ url_for('view_cart') }}">Voltar ao Carrinho</a>
</body>
</html>
